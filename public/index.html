<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#141b19" />
    <title>同桌 · 德州扑克</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%232e8064'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-size='51' fill='%23f2dfb0'%3E%E2%99%A0%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/chips.css" />
    <link rel="stylesheet" href="/lobby.css" />
    <link rel="stylesheet" href="/social.css" />
    <link rel="stylesheet" href="/avatars.css" />
    <link rel="stylesheet" href="/hand-info.css" />
    <link rel="stylesheet" href="/table-layout.css" />
    <link rel="stylesheet" href="/table-landscape.css" />
    <link rel="stylesheet" href="/celebration.css" />
    <link rel="stylesheet" href="/account.css" />
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/vendor/lucide.js" defer></script>
    <script src="/dealing.js" defer></script>
    <script src="/chip-plan.js" defer></script>
    <script src="/chips.js" defer></script>
    <script src="/social-catalog.js" defer></script>
    <script src="/lobby.js" defer></script>
    <script src="/social.js" defer></script>
    <script src="/avatars.js" defer></script>
    <script src="/audio.js" defer></script>
    <script src="/table-layout.js" defer></script>
    <script src="/celebration.js" defer></script>
    <script src="/account.js" defer></script>
    <script src="/portal.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="同桌德州扑克首页"
          ><span class="brand-mark">♠</span
          ><span
            ><strong>同桌</strong><span class="brand-sub">德州扑克</span></span
          ></a
        >
        <div class="topbar-right">
          <div class="topbar-identity" id="topbar-identity"></div>
          <span class="play-money">休闲筹码</span>
          <div class="sound-controls">
            <button class="icon-button" id="sound-button" aria-label="开启音效" title="开启音效" aria-pressed="false"><i data-lucide="volume-x"></i></button>
            <input type="range" id="sound-volume" min="0" max="100" step="5" value="40" aria-label="音效音量" title="音效音量" />
          </div>
          <span class="connection" id="connection"
            ><span class="status-dot"></span
            ><span id="connection-label">连接中</span></span
          ><button
            class="icon-button"
            id="history-button"
            title="牌局记录"
            aria-label="牌局记录"
          >
            <i data-lucide="history"></i>
          </button>
        </div>
      </header>
      <main id="portal-view" hidden></main>
      <main id="home-view"></main>
      <div class="workspace" id="game-view" hidden>
        <div class="table-overlay-backdrop" id="room-backdrop" hidden></div>
        <aside class="sidebar" id="room-drawer" aria-label="房间设置" hidden>
          <div class="drawer-heading"><h2>房间设置</h2><button class="icon-button" id="close-room" title="关闭房间设置" aria-label="关闭房间设置"><i data-lucide="x"></i></button></div>
          <section id="room-panel" class="room-panel" hidden>
            <span class="eyebrow">同桌 · 私人牌桌</span>
            <div class="room-title">
              <h1>房间 <span id="room-code"></span></h1>
              <button
                class="icon-button"
                id="leave-button"
                title="返回大厅"
                aria-label="返回大厅"
              >
                <i data-lucide="log-out"></i>
              </button>
            </div>
            <div class="room-meta">
              <span id="room-blinds"></span><span id="player-count"></span>
            </div>
            <div class="room-wallet" id="room-wallet" hidden>
              <div class="room-wallet-item"><span>钱包余额</span><strong id="wallet-balance">—</strong></div>
              <div class="room-wallet-item"><span>桌上筹码</span><strong id="wallet-table">—</strong></div>
            </div>
            <div class="invite-actions">
              <button class="button secondary" id="copy-button">
                <i data-lucide="link"></i>邀请好友</button
              ><button
                class="icon-button bordered"
                id="share-button"
                title="分享房间"
                aria-label="分享房间"
              >
                <i data-lucide="share-2"></i>
              </button>
            </div>
            <div class="section-label">
              <span>入座玩家</span><span id="seated-count"></span>
            </div>
            <div id="roster" class="roster"></div>
            <label class="auto-next-control" id="auto-next-control">
              <input type="checkbox" id="auto-next" checked />
              <span>自动下一手</span>
            </label>
            <div class="host-actions">
              <div class="segmented bot-difficulty" id="bot-difficulty" role="group" aria-label="陪练难度">
                <button type="button" data-difficulty="easy">简单</button
                ><button type="button" data-difficulty="normal" class="active">正常</button
                ><button type="button" data-difficulty="hard">困难</button>
              </div>
              <button id="bot-button" class="button secondary full">
                <i data-lucide="bot"></i>添加电脑玩家</button
              ><button id="start-button" class="button primary full">
                <i data-lucide="play"></i
                ><span id="start-label">开始牌局</span></button
              ><button id="rebuy-button" class="button secondary full" hidden>
                <i data-lucide="coins"></i>补充筹码
              </button>
            </div>
            <p class="room-wait" id="room-wait"></p>
          </section>
          <div class="network-panel">
            <div class="section-label">
              <span>本机牌桌地址</span><i data-lucide="radio"></i>
            </div>
            <div id="network-addresses" class="network-addresses">
              <span>正在获取地址</span>
            </div>
          </div>
          <div class="sidebar-bottom">
            <span class="small-suits">♠ <b>♥</b> ♣ <b>♦</b></span
            ><span>好牌，也要好朋友。</span>
          </div>
        </aside>
        <main class="game-area">
          <div class="table-topline">
            <div class="table-ident">
              <button class="icon-button" id="room-toggle" title="房间设置" aria-label="房间设置"><i data-lucide="sliders-horizontal"></i></button>
              <strong id="table-room-code"></strong><span id="table-blinds"></span>
            </div>
            <div class="hand-status">
              <span id="hand-number">尚未开局</span
              ><span class="round-badge" id="round-label">等待入座</span>
            </div>
          </div>
          <div class="table-stage" id="table-stage">
            <div class="card-deck" id="card-deck" aria-hidden="true">
              <span class="deck-card"></span><span class="deck-card"></span><span class="deck-card"></span>
            </div>
            <div class="poker-table">
              <div class="felt-border"></div>
              <div class="felt-print">
                <span>同桌</span><small>TEXAS HOLD'EM</small>
              </div>
            </div>
            <div class="table-center" id="table-center">
              <div class="pot-display">
                <span id="pot-label">底池</span
                ><strong id="pot-amount" class="chip-money" data-money-key="pot">0</strong>
                <span id="pot-pile" data-chip-anchor="pot" aria-hidden="true"></span>
              </div>
              <div id="board" class="board" aria-label="公共牌"></div>
              <div class="center-message" id="center-message">等待玩家入座</div>
              <div id="side-pots" class="side-pots"></div>
            </div>
            <div id="seats" class="seats"></div>
          </div>
          <div class="game-bottom">
            <div class="hand-strip">
              <section id="self-hand-panel" class="self-hand-panel" aria-label="我的手牌" hidden></section>
              <div class="settlement-strip" id="settlement-strip" hidden>
                <div id="settlement-summary" aria-live="polite"></div>
                <button class="icon-button" id="result-toggle" title="查看本手结算" aria-label="查看本手结算"><i data-lucide="list-end"></i></button>
              </div>
              <span class="table-ready" id="table-ready">等待玩家入座</span>
            </div>
            <section
              id="action-panel"
              class="action-panel"
              aria-label="下注操作"
            >
              <div class="action-status">
                <div class="your-stack">
                  <i data-lucide="coins"></i>
                  <div>
                    <span>你的筹码</span><strong id="your-stack">—</strong>
                  </div>
                </div>
                <div class="turn-message">
                  <span id="turn-message">等待入座</span
                  ><span id="countdown" class="countdown"></span>
                </div>
              </div>
              <div id="betting-controls" class="betting-controls" hidden>
                <div class="raise-control" id="raise-editor" aria-label="调整下注" hidden>
                  <div class="raise-heading"><strong>调整下注</strong><button class="icon-button" id="close-raise" title="关闭加注面板" aria-label="关闭加注面板"><i data-lucide="x"></i></button></div>
                  <div class="raise-label">
                    <label for="raise-amount">加注至</label>
                    <div class="raise-input-wrap">
                      <input
                        id="raise-amount"
                        type="number"
                        min="0"
                        step="1"
                        inputmode="numeric"
                        aria-label="加注总额"
                      /><span>筹码</span>
                    </div>
                  </div>
                  <input
                    id="raise-slider"
                    type="range"
                    aria-label="调整加注总额"
                    min="0"
                    max="2000"
                    step="1"
                  />
                  <div class="raise-presets">
                    <button data-preset="min">最小</button
                    ><button data-preset="half">½ 底池</button
                    ><button data-preset="pot">底池</button
                    ><button data-preset="max">全下</button>
                  </div>
                  <button class="button primary" id="raise-button"><i data-lucide="check"></i><span>确认加注</span></button>
                </div>
                <div class="action-buttons">
                  <button class="button fold" id="fold-button">
                    <i data-lucide="x"></i>弃牌</button
                  ><button class="button secondary" id="call-button">
                    <i data-lucide="check"></i><span>过牌</span></button
                  ><button class="button primary" id="raise-toggle">
                    <i data-lucide="arrow-up"></i><span>加注</span></button
                  ><button class="button all-in" id="all-in-button">
                    <i data-lucide="layers"></i>全下
                  </button>
                </div>
              </div>
              <div class="idle-controls" id="idle-controls">
                <button class="button secondary" id="quick-invite"><i data-lucide="user-round-plus"></i><span>邀请好友</span></button>
                <button class="button primary" id="quick-start" hidden><i data-lucide="play"></i><span>开始牌局</span></button>
                <button class="button secondary" id="quick-rebuy" hidden><i data-lucide="coins"></i><span>补充筹码</span></button>
                <div class="show-cards-row" id="show-cards-row" hidden><button class="button secondary" id="show-cards-button"><i data-lucide="eye"></i><span>亮牌</span></button></div>
                <span id="idle-message"></span>
              </div>
            </section>
            <section id="social-bar" class="social-bar" aria-label="桌边互动"></section>
            <div class="table-footnote">
              <span><i data-lucide="lock-keyhole"></i>私人牌桌</span
              ><span id="last-event">同桌 · TEXAS HOLD'EM</span>
            </div>
          </div>
        </main>
        <div class="table-overlay-backdrop" id="result-backdrop" hidden></div>
        <aside id="result-drawer" class="result-drawer" aria-label="本手结算" hidden>
          <div class="drawer-heading"><h2>本手结算</h2><button class="icon-button" id="close-result" title="关闭结算" aria-label="关闭结算"><i data-lucide="x"></i></button></div>
          <section id="result-panel" class="result-panel" hidden aria-live="polite"></section>
        </aside>
      </div>
    </div>
    <div class="drawer-backdrop" id="history-backdrop" hidden></div>
    <aside
      class="history-drawer"
      id="history-drawer"
      hidden
      aria-label="牌局记录"
    >
      <div class="drawer-heading">
        <h2>牌局记录</h2>
        <button
          id="close-history"
          class="icon-button"
          title="关闭记录"
          aria-label="关闭记录"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <ol id="history-list">
        <li class="empty-history">暂无记录</li>
      </ol>
    </aside>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
